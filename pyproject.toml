[project]
name = "training-planner"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "garminconnect[workout]",
    "python-dotenv",
]

[project.scripts]
plan = "training_planner.cli.plan:main"
workouts = "training_planner.cli.workouts:main"
garmin-login = "training_planner.cli.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training_planner"]
